# Configuración del monitor de ofertas LifeMiles.
# Editá los destinos y los umbrales según tu estrategia.

# Cada búsqueda combina origin + destination + una ventana de fechas.
# La herramienta rota entre todas las rutas en cada ciclo del scheduler.
routes:
  - origin: BOG        # Bogotá
    destination: MAD   # Madrid
  - origin: BOG
    destination: MIA   # Miami
  - origin: BOG
    destination: SCL   # Santiago de Chile
  - origin: MDE        # Medellín
    destination: JFK   # Nueva York
  - origin: BOG
    destination: GRU   # São Paulo

search:
  cabins: [economy, business]   # cabinas a monitorear
  passengers: 1
  # Ventana de fechas relativa a hoy (en días). Busca salidas entre
  # start_offset y end_offset días desde hoy.
  date_window_days:
    start_offset: 14
    end_offset: 120
  # Cuántas fechas concretas muestrear dentro de la ventana por ciclo.
  sample_dates_per_cycle: 6

# Un resultado se marca como "oferta" (deal) si cumple cualquiera de estos.
# Umbrales de millas por cabina; por debajo => alerta.
deals:
  max_miles:
    economy: 30000
    business: 90000
  # También alerta si las millas caen X% respecto al mínimo histórico
  # visto para esa misma ruta+cabina.
  drop_pct_vs_historical: 15

scheduler:
  # Segundos entre ciclos de búsqueda. Conservador a propósito:
  # polling agresivo => baneo de cuenta/IP. No lo bajes de 60.
  interval_seconds: 900        # 15 minutos
  jitter_seconds: 120          # +/- aleatorio para no ser predecible
  # Pausa mínima entre requests individuales dentro de un ciclo.
  per_request_delay_seconds: 4
